name: Test Secret Masking

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/actions/mask-secrets/**"
      - "etl-pipeline/utils/load_env.py"
      - "etl-pipeline/config/.env.test.secrets"
      - ".github/workflows/test-secret-masking.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  test-masking:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::946183545209:role/GithubActionsDeployerRole
          aws-region: us-east-1

      - name: Mask secrets
        uses: ./.github/actions/mask-secrets

      - name: Load test environment variable
        run: |
          # Fetch the test secret value
          TEST_VALUE=$(aws ssm get-parameter \
            --name "/drb/qa/test/test" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)
          
          echo "TEST_VAR=${TEST_VALUE}" >> $GITHUB_ENV

      - name: Attempt to print masked secret (should be hidden)
        run: |
          echo "======================================"
          echo "Testing secret masking..."
          echo "======================================"
          echo "TEST_VAR value (should be masked): $TEST_VAR"
          echo "======================================"
          echo ""
          echo "✅ If the value above shows '***' instead of the actual secret, masking is working!"
          echo "❌ If you can see the actual secret value, masking failed!"
