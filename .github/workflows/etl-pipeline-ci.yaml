# This workflow runs tests against the deployed to QA API server

name: ETL Pipeline CI

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  run-tests:

    # Configure use of self-hosted GHA runner
    # Self-hosted runner is needed so that the workflow can access hosts only \
    # available on the NYPL private AWS sub-net.
    runs-on: self-hosted
    
    env:
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - name: Get AWS credentials for IAM role in primary NYPL account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::491147561046:role/GithubActionsRunnerRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHAPrimarySession-${{ github.run_id }}
          audience: sts.amazonaws.com

      - name: Get AWS credentials for IAM role in nypl-digital-dev account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::946183545209:role/GHACrossAccountRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHASecondarySession-${{ github.run_id }}
          role-chaining: true
          role-duration-seconds: 1800 # 30 mins
          audience: sts.amazonaws.com

      - name: Mask secrets
        uses: ./.github/actions/mask-etl-pipeline-secrets

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: 'etl-pipeline/.python-version'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('etl-pipeline/requirements.txt', 'etl-pipeline/dev-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install GCC 12
        run: |
          sudo apt update
          sudo apt install -y gcc-12 g++-12
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 60
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 60

      - name: Install dependencies
        working-directory: ./etl-pipeline
        run: |
          python -m pip install --upgrade pip wheel
          pip install --prefer-binary -r dev-requirements.txt
          pip install --prefer-binary -r requirements.txt

      - name: Run API integration tests against QA env
        working-directory: ./etl-pipeline
        run: |
          pytest tests/integration/api --env=qa

      - name: Run ingest functional tests against QA env
        working-directory: ./etl-pipeline
        run: |
          pytest tests/functional/processes/ingest \
            --retries=3 \
            --retries-delay=5 \
            --env=qa

      - name: Run LLM behavior tests against QA env
        working-directory: ./etl-pipeline
        run: |
          pytest tests/stochastic_processes --env=qa
