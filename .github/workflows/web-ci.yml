name: Web CI

on:
  # will run on all PRs that are opened or updated (synchronized)
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "web/**"
      - "!web/**/*.md"
      - ".github/workflows/web-*.yml"
      - ".github/workflows/web-*.yaml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "web/.nvmrc"
          cache: npm
          cache-dependency-path: "web/package-lock.json"

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Lint
        working-directory: ./web
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "web/.nvmrc"
          cache: npm
          cache-dependency-path: "web/package-lock.json"

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Typecheck
        working-directory: ./web
        run: node_modules/typescript/bin/tsc --noEmit

  unit_tests:
    name: Test & Coverage
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "web/.nvmrc"
          cache: npm
          cache-dependency-path: "web/package-lock.json"

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Test
        working-directory: ./web
        run: npm run test

  docker_build:
    # Don't push anything to ECR, just build the docker image to make sure there are no build failures
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Build and export Docker image
        env:
            APP_ENV: development
            AIRTABLE_KEY: dummy_airtable_api_key  # Prevent exposure in exported artifact
        working-directory: ./web
        run: |
          docker build -f Dockerfile \
            --build-arg APP_ENV=$APP_ENV \
            --build-arg airtable_api_key=$AIRTABLE_KEY \
            -t web:test .
          docker save -o /tmp/web.tar web:test

      - name: Upload Docker image as artifact  # For usage in Playwright tests
        uses: actions/upload-artifact@v4
        with:
          name: web-image
          path: /tmp/web.tar
          retention-days: 1  # Use lowest retention time in case cleanup job fails

  playwright_tests:
    needs: docker_build
    uses: ./.github/workflows/web-playwright-tests.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    with:
      base_url: "http://local.nypl.org:3000/"

  cleanup:
    name: Clean up Docker image artifact
    needs: [playwright_tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete web-image artifact  # Done natively for security
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: context.runId });
            const id = data.artifacts.find(a => a.name === "web-image")?.id;
            if (id) await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: id });
            console.log(id ? 'Docker image deleted successfully' : 'Docker image not found');
