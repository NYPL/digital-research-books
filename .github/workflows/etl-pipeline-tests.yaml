name: ETL Pipeline Tests (Pull Request)

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "etl-pipeline/api/**"
      - "etl-pipeline/managers/**"
      - "etl-pipeline/mappings/**"
      - "etl-pipeline/model/**"
      - "etl-pipeline/processes/**"
      - "etl-pipeline/services/**"
      - "etl-pipeline/tests/**"
      - "etl-pipeline/utils/**"
      - "etl-pipeline/dev-requirements.txt"
      - "etl-pipeline/requirements.txt"
      - "etl-pipeline/main.py"
      - "etl-pipeline/Makefile"
      - "etl-pipeline/Dockerfile"
      - ".github/workflows/etl-pipeline-tests.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      IS_CI: "true"
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::946183545209:role/GithubActionsDeployerRole
          aws-region: us-east-1

      - name: Install build essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 60
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 60

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            etl-pipeline/requirements.txt
            etl-pipeline/dev-requirements.txt

      - name: Install Python dependencies
        working-directory: ./etl-pipeline
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt -r dev-requirements.txt

      - name: Check formatting
        working-directory: ./etl-pipeline
        run: |
          ruff format --check

      - name: Run unit tests
        working-directory: ./etl-pipeline
        run: |
          make unit

      - name: Build Docker images with cache
        id: build-images
        working-directory: ./etl-pipeline
        run: |
          docker compose build --progress plain \
            --build-arg BUILDKIT_INLINE_CACHE=1

      - name: Start services
        working-directory: ./etl-pipeline
        run: |
          docker compose up -d

      - name: Wait for services to be healthy
        working-directory: ./etl-pipeline
        run: |
          ./docker-compose-healthcheck.sh

      - name: Run functional tests
        env:
          ENVIRONMENT: local
        working-directory: ./etl-pipeline
        run: |
          make functional

      - name: Run integration tests (DRB)
        env:
          ENVIRONMENT: local
        working-directory: ./etl-pipeline
        run: |
          make integration-drb

      - name: Run integration tests (VRA)
        env:
          ENVIRONMENT: qa  # VRA depends on services not yet available locally
          DRB_API_URL: http://127.0.0.1:5050  # Override to a local instance
        working-directory: ./etl-pipeline
        run: |
          make integration-vra

      - name: Dump service logs
        if: always() && steps.build-images.outcome == 'success'
        working-directory: ./etl-pipeline
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Cleanup
        if: always()
        working-directory: ./etl-pipeline
        run: |
          docker compose down
