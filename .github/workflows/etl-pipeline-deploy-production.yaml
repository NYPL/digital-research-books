name: Deploy ETL Pipeline to Production

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  publish_production:
    name: Publish image to ECR and update ECS stack
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2

      - name: Configure AWS credentials from Prod account
        uses: ./.github/actions/aws-auth-for-gha-runner

      - name: Mask secrets
        uses: ./.github/actions/mask-etl-pipeline-secrets

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sfr_ingest_pipeline
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./etl-pipeline
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:production
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:production

      - name: Force ECS Update
        run: |
          aws ecs update-service --cluster sfr-pipeline-production-tf --service sfr-pipeline-production-tf --force-new-deployment
