services:
  devsetup:
    extends:
      file: docker-compose.yml
      service: devsetup

  database:
    extends:
      file: docker-compose.yml
      service: database

  elasticsearch:
    extends:
      file: docker-compose.yml
      service: elasticsearch

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  aws_services:
    extends:
      file: docker-compose.yml
      service: aws_services

  seeddb:
    container_name: drb_local_seed
    depends_on:
      devsetup:
        condition: service_started
      database:
        condition: service_started
      elasticsearch:
        condition: service_started
      aws_services:
        condition: service_started
      redis:
        condition: service_started

    build:
      context: .
    command: -e local-compose -p SeedLocalDataProcess -i daily
    volumes:
      - type: bind
        source: .
        target: /src
        read_only: true

volumes:
  drb_local_dbdata:
  drb_local_esdata:
  drb_local_mqdata:
  drb_local_rsdata:
